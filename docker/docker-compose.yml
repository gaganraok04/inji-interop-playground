version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=development
      - INJI_CERTIFY_URL=${INJI_CERTIFY_URL:-http://host.docker.internal:8090/v1/certify}
      - INJI_WALLET_URL=${INJI_WALLET_URL:-http://host.docker.internal:3004}
      - INJI_VERIFY_URL=${INJI_VERIFY_URL:-http://host.docker.internal:8081/v1/verify}
      - MIMOTO_URL=${MIMOTO_URL:-http://host.docker.internal:8099/v1/mimoto}
      - ESIGNET_REDIRECT_URI=${ESIGNET_REDIRECT_URI:-http://localhost:3004/redirect}
      - TEST_STORE_DB_PATH=/app/data/test_store.db
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
